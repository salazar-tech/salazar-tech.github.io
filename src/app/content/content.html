<div class="component-wrapper-b">
    <div class="component-content">
        <h2 class="component-title">Access the Latest</h2>
        <div class="content-grid">
            @for (card of cards; track $index) {
                <mat-card>
                    <mat-card-header>
                        <mat-card-title>{{ card.type }}</mat-card-title>
                    </mat-card-header>
                    <mat-card-content>
                        {{ card.content }}
                    </mat-card-content>
                    <img mat-card-image [src]="card.image" [alt]="card.alt">
                </mat-card>
            }
        </div>
    </div>
</div>
